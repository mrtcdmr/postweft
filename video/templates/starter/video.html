<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/_lib/common.css">
<style>
  .num { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; font-size: 84px; background: var(--accent); }
  .pt { left: 80px; right: 80px; display: flex; gap: 36px; align-items: center; padding: 40px 44px; }
  .pt h2 { font-size: 64px; line-height: 1.08; }
  .pt p { margin-top: 12px; font-size: 40px; font-weight: 700; color: #57534e; }
  .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .4; }
</style>
</head>
<body>
<div id="stage">
  <div id="hook" class="scene dots">
    <div id="b1" class="blob" style="width:700px;height:700px;left:-220px;top:-120px;background:var(--accent2)"></div>
    <div id="b2" class="blob" style="width:620px;height:620px;right:-220px;bottom:120px;background:var(--accent)"></div>
    <div id="hookText" class="abs head disp" style="top:620px"></div>
  </div>
  <div id="list" class="scene dots">
    <div id="listHead" class="abs disp" style="left:80px;top:170px;font-size:52px;color:var(--text-on-bg)"></div>
    <div id="points"></div>
  </div>
  <div id="cta" class="scene paper">
    <div id="ctaText" class="abs head disp" style="top:700px;color:var(--ink);text-align:center"></div>
    <div id="ctaChip" class="abs chip brut-sm" style="left:0;top:0;background:var(--accent);font-size:52px"></div>
  </div>
</div>

<script src="/_lib/common.js"></script>
<script type="module">
import * as M from "./timeline.mjs";
const { DATA, STARTS, END, DURATION } = M;

$("hookText").textContent = DATA.hook;
$("listHead").textContent = DATA.hook;
$("ctaText").textContent = DATA.cta;
$("ctaChip").innerHTML = `${DATA.handle} ${ico(ICON.arrow(), 52)}`;
$("points").innerHTML = DATA.points.map((p, i) => `
  <div id="p${i}" class="abs pt card brut" style="top:${430 + i * 400}px">
    <div class="num disp brut-sm">${i + 1}</div>
    <div><h2 class="disp">${p.title}</h2><p>${p.note}</p></div>
  </div>`).join("");

// center the chip under the CTA text once fonts are in
function layout() {
  const c = $("ctaChip"), r = $("ctaText").getBoundingClientRect();
  c.style.left = (1080 - c.offsetWidth) / 2 + "px"; c.style.top = r.bottom + 70 + "px";
}

window.render = (t) => {
  scenes(t, [["hook", 0, STARTS[0]], ["list", STARTS[0], END], ["cta", END, DURATION + 1]]);
  // hook: stamp in, float, leave
  const sh = shake(t, M.STAMPS);
  T("hookText", outUp({ ...stampIn(t, 0.25), x: sh }, t, STARTS[0] - 0.25));
  T("b1", { x: 40 * Math.sin(t * 1.3), y: 30 * Math.cos(t) });
  T("b2", { x: -40 * Math.sin(t * 1.1), y: -30 * Math.cos(t * 1.2) });
  // list: header slides down, each point pops in at its start and the earlier ones dim a little
  T("listHead", slideIn(t, STARTS[0], 0, -80));
  DATA.points.forEach((_, i) => {
    const st = { ...slideIn(t, STARTS[i], 0, 220), ...(t >= STARTS[i] ? {} : { o: 0 }) };
    const later = STARTS[i + 1] != null && t > STARTS[i + 1] ? 0.55 : 1;
    T("p" + i, { ...st, o: (st.o ?? 1) * later, s: t >= STARTS[i] ? 0.96 + 0.04 * eBack(P(t, STARTS[i], 0.35)) : 1 });
  });
  // call to action
  T("ctaText", pop(t, END + 0.2));
  T("ctaChip", { ...pop(t, END + 0.7), y: 8 * Math.sin((t - END) * 4) });
};

window.ready = (async () => { await document.fonts.ready; await imagesReady(); layout(); })();
</script>
</body>
</html>
