<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/_lib/common.css">
<style>
  html, body { height: 1350px; }
  .slide { position: absolute; inset: 0; visibility: hidden; padding: 110px 90px; display: flex; flex-direction: column; }
  .kicker { align-self: flex-start; font-size: 34px; padding: 12px 28px; background: var(--accent); }
  .cover h1 { margin-top: auto; font-size: 118px; line-height: 1.04; color: var(--text-on-bg); }
  .swipe { margin-top: 70px; align-self: flex-start; font-size: 40px; color: var(--ink); background: var(--paper); }
  .tip .num { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; font-size: 96px; background: var(--accent); }
  .tip .card { margin-top: auto; margin-bottom: auto; padding: 70px 64px; }
  .tip h2 { margin-top: 44px; font-size: 84px; line-height: 1.05; }
  .tip p { margin-top: 30px; font-size: 46px; line-height: 1.3; font-weight: 600; color: #57534e; }
  .closing h2 { margin-top: auto; font-size: 100px; line-height: 1.06; color: var(--ink); }
  .closing .chip { margin-top: 60px; margin-bottom: auto; align-self: flex-start; font-size: 48px; background: var(--accent); }
  .count { position: absolute; right: 70px; bottom: 60px; font-size: 32px; font-weight: 800; color: var(--text-on-bg); opacity: .8; }
  .paper .count { color: var(--ink); }
</style>
</head>
<body>
<div id="stage"></div>

<script src="/_lib/common.js"></script>
<script type="module">
import * as M from "./timeline.mjs";
const { DATA, TIPS, CLOSING, SLIDES } = M;
const count = (i) => (SLIDES > 1 ? `<div class="count">${i + 1}/${SLIDES}</div>` : "");

const html = [`
  <div id="s0" class="slide cover dots">
    <div class="chip kicker raised-sm">${DATA.kicker}</div>
    <h1 class="disp">${DATA.hook}</h1>
    ${SLIDES > 1 ? `<div class="chip swipe raised-sm">Swipe ${ico(ICON.arrow(), 40)}</div>` : ""}
    ${count(0)}
  </div>`];
TIPS.forEach((tip, k) => html.push(`
  <div id="s${k + 1}" class="slide tip dots">
    <div class="card raised">
      <div class="num disp raised-sm">${k + 1}</div>
      <h2 class="disp">${tip.title}</h2>
      <p>${tip.note}</p>
    </div>
    ${count(k + 1)}
  </div>`));
if (CLOSING) html.push(`
  <div id="s${SLIDES - 1}" class="slide closing paper">
    <h2 class="disp">${DATA.cta}</h2>
    <div class="chip raised-sm">${DATA.handle} ${ico(ICON.arrow(), 48)}</div>
    ${count(SLIDES - 1)}
  </div>`);
$("stage").innerHTML = html.join("");

// render(i) shows slide i (whole numbers; capture.mjs "slides" mode calls it once per slide)
window.render = (i) => { for (let k = 0; k < SLIDES; k++) show("s" + k, k === Math.round(i)); };
window.ready = (async () => { await document.fonts.ready; await imagesReady(); })();
</script>
</body>
</html>
